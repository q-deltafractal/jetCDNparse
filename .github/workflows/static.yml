name: compile static

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    steps:
      - uses: actions/checkout@v6
  
      - name: hello, uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
   
      - name: compile
        run: cd jetCDNparse && uv run main.py --static-prefix "/jetCDNparse" -v

      - name: compress
        run: | # all-inplace-recursive-verbose
          docker run --rm \
            -v "$GITHUB_WORKSPACE/dist":/source \
            -w /source \
            tdewolff/minify:latest \
            -airv .

      - name: push
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # actions actually does this :)
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
