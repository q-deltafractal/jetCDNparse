[project]
name = "jetCDNparse"
version = "0.1.0"
authors = [
	{ name="q-deltaftactal" }
]
description = "a small JetBrains API parser"
readme = "README.md"
license = "WTFPL"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.11"
dependencies = [
    "environs>=15.0.1",
    "httpx[socks]>=0.28.1",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

[project.urls]
Repository = "https://github.com/q-deltafractal/jetCDNparse.git"
Issues = "https://github.com/q-deltafractal/jetCDNparse/issues"

[tool.ruff.format]
quote-style = "single"
